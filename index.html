<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Навигатор по корпусу</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #222; color: #fff; }
    #map-container { width: 100vw; height: 80vh; overflow: hidden; }
    #map-container svg { width: 100%; height: 100%; display: block; }
    .controls { padding: 10px; text-align: center; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .route-line { stroke: #00FF00; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        /* Стиль для комнаты, которую выбрали как старт */
    .start-room {
        stroke: #00FF00; /* Зеленая обводка */
        stroke-width: 4px;
        cursor: pointer;
    }
    /* Стиль для комнаты, которую выбрали как финиш */
    .end-room {
        stroke: #FF0000; /* Красная обводка */
        stroke-width: 4px;
        cursor: pointer;
    }
    /* Курсор-рука для всех комнат */
    #Rooms [id^="room-"] { cursor: pointer; }
    /* Подписи лежат поверх комнат и перехватывали бы клики */
    #Texts { pointer-events: none; }
    .status { margin: 0; padding: 10px 14px; font-size: 14px; }
    .status.hidden { display: none; }
    .status ul { margin: 6px 0 0; padding-left: 20px; }
    .status.error { background: #5a1d1d; color: #ffd6d6; }
    .status.warning { background: #5a4a1d; color: #fff1c9; }
  </style>
</head>
<body>

  <div id="status" class="status hidden" role="alert"></div>

  <div id="map-container">
    <!-- Сюда мы вставим SVG-карту через fetch -->
    <div id="map-wrapper"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
