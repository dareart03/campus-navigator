<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Навигатор по корпусу</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #222; color: #fff; }

    /* Переключатель этажей */
    .floor-tabs { display: flex; gap: 8px; padding: 8px 10px; justify-content: center; background: #2c2c2c; }
    .floor-tabs button { min-width: 64px; padding: 10px 16px; font-size: 16px; cursor: pointer;
        background: #3a3a3a; color: #fff; border: 2px solid transparent; border-radius: 8px; position: relative; }
    .floor-tabs button.active { border-color: #4da3ff; background: #26456b; }
    /* Точка на кнопке этажа, где проходит маршрут */
    .floor-tabs button.has-route::after { content: ''; position: absolute; top: 4px; right: 4px;
        width: 8px; height: 8px; border-radius: 50%; background: #00FF00; }

    /* Поиск */
    .search-panel { padding: 8px 10px; background: #2c2c2c; }
    /* На карте «поле поиска» — кнопка: нажатие открывает отдельный экран поиска */
    .search-trigger { display: block; width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; text-align: left;
        color: #aaa; background: #3a3a3a; border: 2px solid #555; border-radius: 8px; cursor: pointer; }
    .search-trigger:active { border-color: #4da3ff; }

    /* Отдельные экраны (поиск, «поделиться») лежат поверх карты на весь экран; карта под ними не теряет вид */
    .screen { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #222; }
    .screen[hidden] { display: none; }
    .screen-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #2c2c2c; }
    .screen-head h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .screen-head input { flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; color: #fff;
        background: #3a3a3a; border: 2px solid #555; border-radius: 8px; }
    .screen-head input:focus { outline: none; border-color: #4da3ff; }
    .back { flex: none; min-width: 44px; height: 44px; font-size: 22px; line-height: 1; cursor: pointer; color: #fff;
        background: #3a3a3a; border: 1px solid #666; border-radius: 8px; }
    .screen-body { flex: 1; overflow-y: auto; padding: 0 0 24px; }
    .screen-body.padded { padding: 12px 14px 24px; }
    .suggestions { margin: 0; padding: 0; list-style: none; }
    .sug { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px;
        padding: 4px 4px 4px 14px; cursor: pointer; border-bottom: 1px solid #3d3d3d; }
    .sug:active { background: #26456b; }
    .sug-text { min-width: 0; }
    .sug-main { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sug-sub { font-size: 12px; color: #aaa; }
    .fav { flex: none; width: 44px; height: 44px; font-size: 22px; color: #ffcc33; background: none; border: 0; cursor: pointer; }
    .sug-heading { padding: 8px 14px 4px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
    .sug-empty { padding: 14px; color: #aaa; font-size: 14px; }

    .quick { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
    .quick button { flex: none; padding: 8px 12px; font-size: 14px; cursor: pointer; color: #fff;
        background: #3a3a3a; border: 1px solid #666; border-radius: 16px; }
    .quick button:active { background: #26456b; }

    #map-wrap { position: relative; }
    /* touch-action: none — жесты обрабатываем сами, браузер не должен их перехватывать (скролл, зум страницы) */
    /* высота — по пропорциям плана (--map-aspect задаёт app.js), но не больше 62% экрана */
    #map-container { position: relative; width: 100%; aspect-ratio: var(--map-aspect, 3 / 2); max-height: 62vh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #map-stage { width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
    .floor-map { width: 100%; height: 100%; }

    /* кнопки под картой, чтобы не закрывать комнаты */
    .map-tools { display: flex; flex-direction: row; justify-content: flex-end; gap: 8px; padding: 6px 10px; }
    .map-tools button { padding: 8px 12px; font-size: 14px; cursor: pointer; color: #fff; border: 1px solid #666;
        border-radius: 8px; background: rgba(40, 40, 40, 0.85); }
    .map-tools button[hidden] { display: none; }
    .map-tools { flex-wrap: wrap; }

    /* Подписи: размер и поворот задаёт app.js через --ls и --rot, чтобы они читались при любом масштабе */
    .floor-map #Texts path { transform-box: fill-box; transform-origin: center;
        transform: rotate(calc(var(--rot, 0) * -1deg)) scale(var(--ls, 1)); }
    .floor-map[hidden] { display: none; }
    .floor-map svg { width: 100%; height: 100%; display: block; }

    /* --inv = 1 / масштаб на экране: толщина линий на экране не зависит от увеличения */
    .route-line { stroke: #00FF00; stroke-width: calc(4px * var(--inv, 1)); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .route-stairs { fill: #00FF00; stroke: #003300; stroke-width: calc(2px * var(--inv, 1)); r: calc(7px * var(--inv, 1)); }

    /* Комната, выбранная как старт / финиш */
    .start-room { stroke: #00FF00; stroke-width: calc(4px * var(--inv, 1)); }
    .end-room   { stroke: #FF0000; stroke-width: calc(4px * var(--inv, 1)); }
    .floor-map [id^="room-"], .floor-map [id^="man-WC"], .floor-map [id^="woman-WC"], .floor-map [id^="special-WC"] { cursor: pointer; }
    /* Подписи лежат поверх комнат и перехватывали бы клики */
    .floor-map #Texts { pointer-events: none; }

    .status { margin: 0; padding: 10px 14px; font-size: 14px; }
    .status.hidden { display: none; }
    .status ul { margin: 6px 0 0; padding-left: 20px; }
    .status.error { background: #5a1d1d; color: #ffd6d6; }
    .status.info { background: #1d3a5a; color: #d6e8ff; }
    .status.warning { background: #5a4a1d; color: #fff1c9; }

    /* Пошаговое описание маршрута */
    .route-info { padding: 8px 14px 16px; }
    .route-info.hidden { display: none; }
    .route-info ol { margin: 6px 0 0; padding-left: 22px; }
    .route-info li { padding: 6px 0; cursor: pointer; }
    /* Ссылка и QR-код маршрута */
    .share { margin-top: 8px; }
    .share-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .share-buttons button { padding: 8px 12px; font-size: 14px; cursor: pointer; color: #fff;
        background: #3a3a3a; border: 1px solid #666; border-radius: 8px; }
    .share-url { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 8px; font-size: 13px; color: #ccc;
        background: #2c2c2c; border: 1px solid #555; border-radius: 6px; }
    .qr { margin-top: 10px; padding: 10px; background: #fff; border-radius: 8px; width: 220px; max-width: 100%; }
    .qr[hidden] { display: none; }
    .share-route { margin: 0 0 4px; font-size: 16px; }
    .share-empty { color: #aaa; }
    .qr svg { display: block; width: 100%; height: auto; }
    .route-info li.current { color: #7dff7d; font-weight: bold; }
  </style>
</head>
<body>

  <div id="status" class="status hidden" role="alert"></div>

  <div id="floor-tabs" class="floor-tabs" role="tablist" aria-label="Этажи"></div>

  <div id="search-panel" class="search-panel">
    <button id="search-open" class="search-trigger" type="button" aria-label="Открыть поиск аудитории или места">Откуда? Номер или название</button>
    <!-- Ближайшее место от выбранного старта -->
    <div id="quick" class="quick" aria-label="Ближайшее место">
      <button type="button" data-poi="wc-man">Туалет (М)</button>
      <button type="button" data-poi="wc-woman">Туалет (Ж)</button>
      <button type="button" data-poi="exit">Выход</button>
      <button type="button" data-poi="dining">Столовая</button>
    </div>
  </div>

  <div id="map-wrap">
    <!-- Жесты ловим на map-container; внутри — «сцена», которую двигаем, масштабируем и поворачиваем -->
    <div id="map-container"><div id="map-stage"></div></div>
    <div class="map-tools">
      <button type="button" id="btn-view" aria-label="Вернуть исходный вид карты">⌖ Вид</button>
      <button type="button" id="btn-share" aria-label="Поделиться маршрутом" hidden>↗ Поделиться</button>
      <button type="button" id="btn-clear" aria-label="Сбросить маршрут" hidden>✕ Сбросить маршрут</button>
    </div>
  </div>

  <div id="route-info" class="route-info hidden"></div>

  <!-- Экран 2: поиск (избранное и недавние — на нём же). Открывается поверх карты, «Назад» возвращает к ней -->
  <section id="screen-search" class="screen" hidden aria-label="Поиск">
    <div class="screen-head">
      <button type="button" class="back" data-back aria-label="Назад к карте">←</button>
      <input id="search" type="search" inputmode="search" enterkeyhint="go" autocomplete="off"
             placeholder="Откуда? Номер или название" aria-label="Поиск аудитории или места">
    </div>
    <div class="screen-body"><ul id="suggestions" class="suggestions"></ul></div>
  </section>

  <!-- Экран 3: поделиться маршрутом (ссылка, QR-код) -->
  <section id="screen-share" class="screen" hidden aria-label="Поделиться маршрутом">
    <div class="screen-head">
      <button type="button" class="back" data-back aria-label="Назад к карте">←</button>
      <h1>Поделиться маршрутом</h1>
    </div>
    <div id="share-body" class="screen-body padded"></div>
  </section>

  <script type="module" src="src/app.js"></script>
</body>
</html>
